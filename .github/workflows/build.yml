name: OpenLogTool CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openlogtool-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  FLUTTER_VERSION: '3.44.7'
  RUST_VERSION: '1.91.1'
  RUST_NIGHTLY: 'nightly-2026-07-26'
  FRB_CODEGEN_VERSION: '2.12.0'
  WASM_PACK_VERSION: '0.15.0'
  CARGO_NDK_VERSION: '4.1.2'
  ANDROID_NDK_VERSION: '28.2.13676358'
  ANDROID_SIGNING_CERT_SHA256: '086f88968be282b45a8253de5a48b5c0c45c33321285116fde5fde86bbe78942'
  # Pin release assets: continuous is replaced upstream and breaks hash checks.
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
  APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-22.04
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      artifact_version: ${{ steps.version.outputs.artifact_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_with_build=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)
          version_name=${version_with_build%%+*}
          short_sha=${GITHUB_SHA:0:7}
          artifact_version="${version_name}-${short_sha}.${GITHUB_RUN_NUMBER}"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$artifact_version" >> "$GITHUB_OUTPUT"

  quality:
    name: Flutter and Rust quality gate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust -> target
          shared-key: openlogtool

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Verify synchronized versions
        run: dart tool/bump_version.dart --check

      - name: Cache flutter_rust_bridge codegen
        id: frb-codegen-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: ${{ runner.os }}-${{ runner.arch }}-frb-codegen-${{ env.FRB_CODEGEN_VERSION }}-rust-${{ env.RUST_VERSION }}

      - name: Install flutter_rust_bridge codegen
        if: steps.frb-codegen-cache.outputs.cache-hit != 'true'
        run: >-
          cargo install --locked flutter_rust_bridge_codegen
          --version "${FRB_CODEGEN_VERSION}"

      - name: Verify generated sources
        run: |
          flutter gen-l10n
          flutter_rust_bridge_codegen generate
          sed -i 's/[[:space:]]\+$//' rust/src/frb_generated.rs
          git diff --exit-code -- \
            lib/l10n/generated \
            lib/src/bridge \
            rust/src/frb_generated.rs

      - name: Analyze Flutter
        run: flutter analyze --no-pub

      - name: Test Flutter
        run: flutter test --no-pub

      - name: Test Rust
        run: cargo test --locked --manifest-path rust/Cargo.toml

  build-web:
    name: Build and verify WebClient
    needs: [version, quality]
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup threaded Rust Web toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          components: rust-src
          targets: wasm32-unknown-unknown

      - name: Cache Rust Web dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust -> target
          shared-key: openlogtool-web-${{ env.RUST_NIGHTLY }}

      - name: Cache Web build tools
        id: web-tools-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/flutter_rust_bridge_codegen
            ~/.cargo/bin/wasm-pack
            ~/.cache/.wasm-pack
          key: ${{ runner.os }}-${{ runner.arch }}-web-tools-frb-${{ env.FRB_CODEGEN_VERSION }}-wasm-pack-${{ env.WASM_PACK_VERSION }}-rust-${{ env.RUST_VERSION }}-lock-${{ hashFiles('rust/Cargo.lock') }}

      - name: Install Web build tools
        if: steps.web-tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked wasm-pack \
            --version "$WASM_PACK_VERSION"
          cargo install --locked flutter_rust_bridge_codegen \
            --version "$FRB_CODEGEN_VERSION"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate build version
        env:
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_BUILD_NUMBER: ${{ github.run_number }}
        run: dart tool/gen_version.dart

      - name: Build WebClient
        env:
          OPENLOGTOOL_WEB_RUST_TOOLCHAIN: ${{ env.RUST_NIGHTLY }}
          WEB_COMMIT_SHA: ${{ github.sha }}
          WEB_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          bash tool/build_web.sh --no-pub \
            --dart-define="GITHUB_SHA=$WEB_COMMIT_SHA" \
            --dart-define="CI_BUILD_NUMBER=$WEB_BUILD_NUMBER"

      - name: Verify WebClient bundle
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/main.dart.js
          test -s build/web/update.html
          test -s build/web/update.js
          cmp web/update.html build/web/update.html
          cmp web/update.js build/web/update.js
          test -s build/web/pkg/openlogtool_core.js
          test -s build/web/pkg/openlogtool_core_bg.wasm
          grep -Fq 'shared:true' build/web/pkg/openlogtool_core.js
          grep -Fq '<title>OpenLogTool</title>' build/web/index.html

      - name: Verify subset font asset
        run: |
          set -euo pipefail
          test -s assets/fonts/SarasaGothicSC-subset.ttf
          grep -Fq 'SarasaGothicSC-subset.ttf' build/web/assets/AssetManifest.bin 2>/dev/null || \
            grep -Fq 'SarasaGothicSC-subset' build/web/assets/AssetManifest.json 2>/dev/null || true

      - name: Package WebClient artifact
        env:
          ARTIFACT_VERSION: ${{ needs.version.outputs.artifact_version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          bundle_name="OpenLogTool-$ARTIFACT_VERSION-WebClient"
          bundle_dir="$RUNNER_TEMP/$bundle_name"
          archive="OpenLogTool-$ARTIFACT_VERSION-WebClient.tar.gz"
          mkdir -p "$bundle_dir/web"
          cp -a build/web/. "$bundle_dir/web/"
          install -m 0644 \
            deploy/web/release/Dockerfile \
            "$bundle_dir/Dockerfile"
          install -m 0755 \
            deploy/web/release/docker-entrypoint.sh \
            "$bundle_dir/docker-entrypoint.sh"
          install -m 0644 \
            deploy/web/release/docker-compose.yml \
            "$bundle_dir/docker-compose.yml"
          install -m 0644 \
            deploy/web/release/README.md \
            "$bundle_dir/README.md"
          install -m 0644 \
            deploy/web/nginx.conf \
            "$bundle_dir/nginx.conf"

          docker compose \
            -f "$bundle_dir/docker-compose.yml" \
            config --quiet
          docker build \
            --file "$bundle_dir/Dockerfile" \
            --tag openlogtool-webclient:release-smoke \
            "$bundle_dir"

          tar -C "$RUNNER_TEMP" -czf "dist/$archive" "$bundle_name"
          tar -tzf "dist/$archive" | grep -Fx "$bundle_name/web/update.html"
          tar -tzf "dist/$archive" | grep -Fx "$bundle_name/web/update.js"

      - name: Upload WebClient artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openlogtool-${{ needs.version.outputs.artifact_version }}-webclient
          path: dist/*WebClient.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build and verify Android
    needs: [version, quality]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Rust and Android targets
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust -> target
          shared-key: openlogtool-android

      - name: Select pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK is missing}}"
          ndk_path="$sdk_root/ndk/$ANDROID_NDK_VERSION"
          if [ ! -d "$ndk_path" ]; then
            "$sdk_root/cmdline-tools/latest/bin/sdkmanager" \
              "ndk;$ANDROID_NDK_VERSION"
          fi
          test -d "$ndk_path"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk_path" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk_path" >> "$GITHUB_ENV"

      - name: Cache cargo-ndk
        id: cargo-ndk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/bin/cargo-ndk-env
            ~/.cargo/bin/cargo-ndk-runner
            ~/.cargo/bin/cargo-ndk-test
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-ndk-${{ env.CARGO_NDK_VERSION }}-rust-${{ env.RUST_VERSION }}

      - name: Install cargo-ndk
        if: steps.cargo-ndk-cache.outputs.cache-hit != 'true'
        run: >-
          cargo install --locked cargo-ndk
          --version "$CARGO_NDK_VERSION"

      - name: Verify cargo-ndk version
        run: test "$(cargo ndk --version)" = "cargo-ndk $CARGO_NDK_VERSION"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Configure Android release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?KEYSTORE_BASE64 is required for a release tag}"
          : "${KEYSTORE_STORE_PASSWORD:?KEYSTORE_STORE_PASSWORD is required}"
          : "${KEYSTORE_KEY_PASSWORD:?KEYSTORE_KEY_PASSWORD is required}"
          : "${KEYSTORE_KEY_ALIAS:?KEYSTORE_KEY_ALIAS is required}"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/keystore.jks
          printf '%s\n' \
            "storeFile=keystore.jks" \
            "storePassword=$KEYSTORE_STORE_PASSWORD" \
            "keyPassword=$KEYSTORE_KEY_PASSWORD" \
            "keyAlias=$KEYSTORE_KEY_ALIAS" \
            > android/app/keystore.properties

      - name: Generate build version
        env:
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_BUILD_NUMBER: ${{ github.run_number }}
        run: dart tool/gen_version.dart

      - name: Build Android release
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub \
            --split-per-abi \
            --target-platform=android-arm,android-arm64,android-x64 \
            --split-debug-info=build/symbols/android \
            --build-name="${{ needs.version.outputs.version_name }}" \
            --build-number="${{ github.run_number }}"
          mkdir -p build/release-apks
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" \
              "build/release-apks/app-$abi-release.apk"
          done
          flutter build apk --release --no-pub \
            --target-platform=android-arm,android-arm64,android-x64 \
            --split-debug-info=build/symbols/android \
            --build-name="${{ needs.version.outputs.version_name }}" \
            --build-number="${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/release-apks/app-universal-release.apk

      - name: Verify split APKs, symbols, and Rust libraries
        run: |
          set -euo pipefail
          extracted_libraries="$(mktemp -d)"
          trap 'rm -rf "$extracted_libraries"' EXIT
          test -n "$(find build/symbols/android -type f -name '*.symbols' -print -quit)"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="build/release-apks/app-$abi-release.apk"
            listing="$extracted_libraries/$abi.list"
            test -s "$apk"
            unzip -t "$apk"
            zipinfo -1 "$apk" > "$listing"
            source_library="android/app/src/main/jniLibs/$abi/libopenlogtool_core.so"
            test -s "$source_library"
            grep -Fx "lib/$abi/libopenlogtool_core.so" "$listing"
            for other_abi in arm64-v8a armeabi-v7a x86_64; do
              if [ "$other_abi" != "$abi" ] &&
                  grep -q "^lib/$other_abi/" "$listing"; then
                echo "$apk unexpectedly contains $other_abi libraries" >&2
                exit 1
              fi
            done
            unzip -p "$apk" "lib/$abi/libopenlogtool_core.so" \
              > "$extracted_libraries/$abi.so"
            test -s "$extracted_libraries/$abi.so"
            readelf --dyn-syms --wide "$extracted_libraries/$abi.so" |
              awk '$NF == "frb_init_frb_dart_api_dl" { found = 1 }
                END { exit found ? 0 : 1 }'
            case "$abi" in
              arm64-v8a) expected_machine='AArch64' ;;
              armeabi-v7a) expected_machine='ARM' ;;
              x86_64) expected_machine='X86-64' ;;
            esac
            readelf -h "$extracted_libraries/$abi.so" |
              grep -E "Machine:.*$expected_machine"
            apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner |
              sort -V | tail -n 1)
            test -n "$apksigner"
            "$apksigner" verify --verbose "$apk"
          done
          universal=build/release-apks/app-universal-release.apk
          universal_listing="$extracted_libraries/universal.list"
          test -s "$universal"
          unzip -t "$universal"
          zipinfo -1 "$universal" > "$universal_listing"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            grep -Fx "lib/$abi/libopenlogtool_core.so" "$universal_listing"
          done
          "$apksigner" verify --verbose "$universal"

      - name: Verify Android release signing certificate
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner |
            sort -V | tail -n 1)
          test -n "$apksigner"
          actual=$("$apksigner" verify --print-certs \
            build/release-apks/app-universal-release.apk |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p; s/^V2 Signer: certificate SHA-256 digest: //p' |
            head -n 1)
          test -n "$actual"
          if [ "$actual" != "$ANDROID_SIGNING_CERT_SHA256" ]; then
            echo "Unexpected Android signing certificate: $actual" >&2
            exit 1
          fi

      - name: Package Android artifacts
        env:
          ARTIFACT_VERSION: ${{ needs.version.outputs.artifact_version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            source="build/release-apks/app-$abi-release.apk"
            artifact="OpenLogTool-$ARTIFACT_VERSION-Android-$abi.apk"
            cp "$source" "dist/$artifact"
          done
          cp build/release-apks/app-universal-release.apk \
            "dist/OpenLogTool-$ARTIFACT_VERSION-Android-universal.apk"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openlogtool-${{ needs.version.outputs.artifact_version }}-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android debug symbols
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-symbols-${{ needs.version.outputs.artifact_version }}-android
          path: build/symbols/android/
          if-no-files-found: error
          retention-days: 90

  build-linux:
    name: Build and smoke-test Linux
    needs: [version, quality]
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust -> target
          shared-key: openlogtool

      - name: Install Linux build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-0 libsecret-1-dev ninja-build pkg-config xauth xvfb

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate build version
        env:
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_BUILD_NUMBER: ${{ github.run_number }}
        run: dart tool/gen_version.dart

      - name: Build Linux release
        run: >-
          flutter build linux --release --no-pub
          --split-debug-info=build/symbols/linux

      - name: Verify bundled Rust core and Dart symbols
        run: |
          set -euo pipefail
          executable=build/linux/x64/release/bundle/openlogtool
          source_library=rust/target/release/libopenlogtool_core.so
          bundled_library=build/linux/x64/release/bundle/lib/libopenlogtool_core.so
          test -x "$executable"
          test -f "$source_library"
          test -f "$bundled_library"
          cmp --silent "$source_library" "$bundled_library"
          readelf -d "$executable" | grep -F '$ORIGIN/lib'
          sha256sum "$source_library" "$bundled_library"
          test -n "$(find build/symbols/linux -type f -name '*.symbols' -print -quit)"

      - name: Smoke-test Flutter bundle
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/openlogtool-bundle-smoke"
          mkdir -p "$smoke_root"/{home,config,data,cache}
          set +e
          (
            cd "$RUNNER_TEMP"
            env \
              HOME="$smoke_root/home" \
              XDG_CONFIG_HOME="$smoke_root/config" \
              XDG_DATA_HOME="$smoke_root/data" \
              XDG_CACHE_HOME="$smoke_root/cache" \
              timeout 10s xvfb-run -a \
              "$GITHUB_WORKSPACE/build/linux/x64/release/bundle/openlogtool"
          ) >"$smoke_root/output.log" 2>&1
          status=$?
          set -e
          cat "$smoke_root/output.log"
          if [ "$status" -ne 124 ]; then
            echo "Expected the running application to be stopped by timeout; exit code was $status" >&2
            exit 1
          fi

      - name: Package and smoke-test archive
        env:
          ARTIFACT_VERSION: ${{ needs.version.outputs.artifact_version }}
        run: |
          set -euo pipefail
          release_dir=build/linux/x64/release
          archive="OpenLogTool-${ARTIFACT_VERSION}-linux-x86_64.tar.gz"
          tar -C "$release_dir" -czf "$release_dir/$archive" bundle

          package_root="$RUNNER_TEMP/openlogtool-package"
          smoke_root="$RUNNER_TEMP/openlogtool-package-smoke"
          mkdir -p "$package_root" "$smoke_root"/{home,config,data,cache}
          tar -xzf "$release_dir/$archive" -C "$package_root"

          set +e
          (
            cd "$RUNNER_TEMP"
            env \
              HOME="$smoke_root/home" \
              XDG_CONFIG_HOME="$smoke_root/config" \
              XDG_DATA_HOME="$smoke_root/data" \
              XDG_CACHE_HOME="$smoke_root/cache" \
              timeout 10s xvfb-run -a "$package_root/bundle/openlogtool"
          ) >"$smoke_root/output.log" 2>&1
          status=$?
          set -e
          cat "$smoke_root/output.log"
          if [ "$status" -ne 124 ]; then
            echo "Extracted package failed its startup smoke test; exit code was $status" >&2
            exit 1
          fi

      - name: Package and smoke-test AppImage
        env:
          ARTIFACT_VERSION: ${{ needs.version.outputs.artifact_version }}
        run: |
          set -euo pipefail
          release_dir=build/linux/x64/release
          appdir="$RUNNER_TEMP/OpenLogTool.AppDir"
          appimagetool="$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          appimage_runtime="$RUNNER_TEMP/runtime-x86_64"
          appimage="$release_dir/OpenLogTool-${ARTIFACT_VERSION}-linux-x86_64.AppImage"
          smoke_root="$RUNNER_TEMP/openlogtool-appimage-smoke"

          curl --fail --location --retry 3 --silent --show-error \
            "$APPIMAGETOOL_URL" --output "$appimagetool"
          printf '%s  %s\n' "$APPIMAGETOOL_SHA256" "$appimagetool" |
            sha256sum --check --strict
          chmod +x "$appimagetool"
          curl --fail --location --retry 3 --silent --show-error \
            "$APPIMAGE_RUNTIME_URL" --output "$appimage_runtime"
          printf '%s  %s\n' "$APPIMAGE_RUNTIME_SHA256" "$appimage_runtime" |
            sha256sum --check --strict

          mkdir -p "$appdir/usr/bin" "$smoke_root"/{home,config,data,cache}
          cp -a "$release_dir/bundle/." "$appdir/usr/bin/"
          ln -s usr/bin/openlogtool "$appdir/AppRun"
          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=OpenLogTool' \
            'Comment=Amateur radio net logging tool' \
            'Exec=openlogtool' \
            'Icon=openlogtool' \
            'Terminal=false' \
            'Type=Application' \
            'Categories=Utility;' \
            > "$appdir/openlogtool.desktop"
          cp assets/images/app_icon_512.png "$appdir/openlogtool.png"

          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 \
            VERSION="$ARTIFACT_VERSION" \
            "$appimagetool" --runtime-file "$appimage_runtime" \
            "$appdir" "$appimage"
          test -x "$appimage"

          set +e
          (
            cd "$RUNNER_TEMP"
            env \
              APPIMAGE_EXTRACT_AND_RUN=1 \
              HOME="$smoke_root/home" \
              XDG_CONFIG_HOME="$smoke_root/config" \
              XDG_DATA_HOME="$smoke_root/data" \
              XDG_CACHE_HOME="$smoke_root/cache" \
              timeout 15s xvfb-run -a "$GITHUB_WORKSPACE/$appimage"
          ) >"$smoke_root/output.log" 2>&1
          status=$?
          set -e
          cat "$smoke_root/output.log"
          if [ "$status" -ne 124 ]; then
            echo "AppImage failed its startup smoke test; exit code was $status" >&2
            exit 1
          fi

      - name: Install RPM tooling
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Package .deb
        env:
          VERSION_NAME: ${{ needs.version.outputs.version_name }}
        run: |
          set -euo pipefail
          mkdir -p dist pkgdeb/DEBIAN pkgdeb/opt/openlogtool \
            pkgdeb/usr/share/applications \
            pkgdeb/usr/share/icons/hicolor/256x256/apps
          cp deploy/linux/DEBIAN/control pkgdeb/DEBIAN/control
          sed -i "s/^Version: .*/Version: $VERSION_NAME/" pkgdeb/DEBIAN/control
          grep -Fq "Version: $VERSION_NAME" pkgdeb/DEBIAN/control
          cp -r build/linux/x64/release/bundle/* pkgdeb/opt/openlogtool/
          cp deploy/linux/openlogtool.desktop pkgdeb/usr/share/applications/
          cp assets/images/app_icon_512.png \
            pkgdeb/usr/share/icons/hicolor/256x256/apps/openlogtool.png
          chmod 755 pkgdeb/opt/openlogtool/openlogtool
          deb="dist/OpenLogTool-$VERSION_NAME-Linux-x86_64.deb"
          dpkg-deb --root-owner-group --build pkgdeb "$deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -Fq './opt/openlogtool/openlogtool'

      - name: Package .rpm
        env:
          VERSION_NAME: ${{ needs.version.outputs.version_name }}
        run: |
          set -euo pipefail
          rpmver="${VERSION_NAME%-R}"
          sed "s/^Version: .*/Version: $rpmver/" deploy/linux/openlogtool.spec \
            > /tmp/openlogtool.spec
          grep -Fq "Version: $rpmver" /tmp/openlogtool.spec
          mkdir -p dist /tmp/rpmbuild/SOURCES
          cp -r build/linux/x64/release/bundle /tmp/rpmbuild/SOURCES/bundle
          cp deploy/linux/openlogtool.desktop /tmp/rpmbuild/SOURCES/
          cp assets/images/app_icon_512.png /tmp/rpmbuild/SOURCES/
          rpmbuild -bb /tmp/openlogtool.spec \
            --define "_topdir /tmp/rpmbuild"
          rpmfile=$(find /tmp/rpmbuild/RPMS -type f -name '*.rpm' | head -n 1)
          test -n "$rpmfile"
          rpm -qpl "$rpmfile" | grep -Fx '/opt/openlogtool/openlogtool'
          cp "$rpmfile" "dist/OpenLogTool-$VERSION_NAME-Linux-x86_64.rpm"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openlogtool-${{ needs.version.outputs.artifact_version }}-linux-x86_64
          path: |
            build/linux/x64/release/*.tar.gz
            build/linux/x64/release/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux debug symbols
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-symbols-${{ needs.version.outputs.artifact_version }}-linux-x86_64
          path: build/symbols/linux/
          if-no-files-found: error
          retention-days: 90

  build-windows:
    name: Build and smoke-test Windows
    needs: [version, quality]
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust -> target
          shared-key: openlogtool-windows

      - name: Ensure Visual C++ ATL is installed
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.ATL `
            -property installationPath
          if ($installationPath) {
            Write-Host "Visual C++ ATL is available in $installationPath"
            exit 0
          }

          $installationPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (!$installationPath) {
            throw "Visual Studio with the C++ toolchain was not found"
          }
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          & $setup modify --installPath $installationPath `
            --add Microsoft.VisualStudio.Component.VC.ATL `
            --quiet --norestart --wait
          if ($LASTEXITCODE -notin @(0, 3010)) {
            throw "Installing Visual C++ ATL failed with exit code $LASTEXITCODE"
          }
          $atlInstallation = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.ATL `
            -property installationPath
          if (!$atlInstallation) {
            throw "Visual C++ ATL is still unavailable after installation"
          }

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate build version
        env:
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_BUILD_NUMBER: ${{ github.run_number }}
        run: dart tool/gen_version.dart

      - name: Build Windows release
        run: >-
          flutter build windows --release --no-pub
          --split-debug-info=build/symbols/windows
          --build-name="${{ needs.version.outputs.version_name }}"
          --build-number="${{ github.run_number }}"

      - name: Verify bundled Rust core and Dart symbols
        shell: pwsh
        run: |
          $source = "rust/target/release/openlogtool_core.dll"
          $bundled = "build/windows/x64/runner/Release/openlogtool_core.dll"
          foreach ($path in @($source, $bundled)) {
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing Rust DLL: $path"
            }
          }
          $sourceHash = (Get-FileHash $source -Algorithm SHA256).Hash
          $bundledHash = (Get-FileHash $bundled -Algorithm SHA256).Hash
          if ($sourceHash -ne $bundledHash) {
            throw "The bundled Rust DLL does not match Cargo output"
          }
          $symbols = Get-ChildItem "build/symbols/windows" -Filter *.symbols -Recurse
          if (!$symbols) {
            throw "Windows Dart debug symbols are missing"
          }

      - name: Package and smoke-test Windows archive
        shell: pwsh
        env:
          ARTIFACT_VERSION: ${{ needs.version.outputs.artifact_version }}
        run: ./tool/package_windows.ps1 -Version $env:ARTIFACT_VERSION -OutputDirectory dist -SmokeTest

      - name: Install pinned Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress --yes

      - name: Build and smoke-test Windows installer
        shell: pwsh
        env:
          ARTIFACT_VERSION: ${{ needs.version.outputs.artifact_version }}
        run: |
          iscc "/DMyAppVersion=$env:ARTIFACT_VERSION" windows/installer.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          $installer = Get-Item "windows/installer/OpenLogTool-Setup-$env:ARTIFACT_VERSION.exe"
          $installRoot = Join-Path $env:RUNNER_TEMP "OpenLogToolInstallerSmoke"
          $arguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=$installRoot"
          )
          $installProcess = Start-Process -FilePath $installer.FullName -ArgumentList $arguments -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) {
            throw "Installer exited with code $($installProcess.ExitCode)"
          }

          $installedExe = Join-Path $installRoot "openlogtool.exe"
          $installedRust = Join-Path $installRoot "openlogtool_core.dll"
          foreach ($path in @($installedExe, $installedRust)) {
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Installed file is missing: $path"
            }
          }
          $bundleRust = "build/windows/x64/runner/Release/openlogtool_core.dll"
          $installedHash = (Get-FileHash $installedRust -Algorithm SHA256).Hash
          $bundleHash = (Get-FileHash $bundleRust -Algorithm SHA256).Hash
          if ($installedHash -ne $bundleHash) {
            throw "The installed Rust DLL does not match the tested bundle"
          }

          $application = Start-Process -FilePath $installedExe -WorkingDirectory $installRoot -PassThru
          try {
            Start-Sleep -Seconds 10
            if ($application.HasExited) {
              throw "Installed app exited with code $($application.ExitCode)"
            }
          }
          finally {
            if (!$application.HasExited) {
              Stop-Process -Id $application.Id -Force
              $application.WaitForExit()
            }
          }

          $destination = Join-Path "dist" $installer.Name
          Copy-Item -LiteralPath $installer.FullName -Destination $destination
          $hash = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Build-time SHA-256: $hash"
          Write-Host "GitHub Release will publish the authoritative asset digest."

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openlogtool-${{ needs.version.outputs.artifact_version }}-windows-x64
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows debug symbols
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-symbols-${{ needs.version.outputs.artifact_version }}-windows-x64
          path: build/symbols/windows/
          if-no-files-found: error
          retention-days: 90

  build-macos:
    name: Build and verify macOS universal
    needs: [version, quality]
    runs-on: macos-15
    timeout-minutes: 55
    env:
      MACOS_RUST_ARCHS: arm64 x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Rust and Darwin targets
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust -> target
          shared-key: openlogtool-macos-universal

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate build version
        env:
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_BUILD_NUMBER: ${{ github.run_number }}
        run: dart tool/gen_version.dart

      - name: Build macOS universal release
        run: >-
          flutter build macos --release --no-pub
          --split-debug-info=build/symbols/macos
          --build-name="${{ needs.version.outputs.version_name }}"
          --build-number="${{ github.run_number }}"

      - name: Verify macOS app bundle and Dart symbols
        run: |
          set -euo pipefail
          app=build/macos/Build/Products/Release/openlogtool.app
          executable="$app/Contents/MacOS/openlogtool"
          library="$app/Contents/Frameworks/libopenlogtool_core.dylib"
          test -x "$executable"
          test -s "$library"
          plutil -lint "$app/Contents/Info.plist"
          xcrun lipo "$executable" -verify_arch arm64 x86_64
          xcrun lipo "$library" -verify_arch arm64 x86_64
          xcrun otool -D "$library" | tail -n +2 |
            grep -Fx '@rpath/libopenlogtool_core.dylib'
          xcrun otool -l "$executable" | grep -A3 LC_RPATH |
            grep -F '@executable_path/../Frameworks'
          codesign --verify --deep --strict --verbose=2 "$app"
          test -n "$(find build/symbols/macos -type f -name '*.symbols' -print -quit)"

      - name: Package and verify macOS artifacts
        env:
          ARTIFACT_VERSION: ${{ needs.version.outputs.artifact_version }}
        run: |
          set -euo pipefail
          app=build/macos/Build/Products/Release/openlogtool.app
          mkdir -p dist
          zip_name="OpenLogTool-$ARTIFACT_VERSION-macOS-universal.zip"
          dmg_name="OpenLogTool-$ARTIFACT_VERSION-macOS-universal.dmg"
          package_app="$RUNNER_TEMP/OpenLogTool.app"
          ditto "$app" "$package_app"
          ditto -c -k --sequesterRsrc --keepParent "$package_app" "dist/$zip_name"

          dmg_stage="$RUNNER_TEMP/openlogtool-dmg-stage"
          mkdir -p "$dmg_stage"
          ditto "$package_app" "$dmg_stage/OpenLogTool.app"
          ln -s /Applications "$dmg_stage/Applications"
          hdiutil create \
            -volname OpenLogTool \
            -srcfolder "$dmg_stage" \
            -ov \
            -format UDZO \
            "dist/$dmg_name"
          hdiutil verify "dist/$dmg_name"

          dmg_mount="$RUNNER_TEMP/openlogtool-dmg-mount"
          mkdir -p "$dmg_mount"
          device=""
          trap 'if [ -n "${device:-}" ]; then hdiutil detach "$device" || true; fi' EXIT
          attach_output=$(hdiutil attach -nobrowse -readonly \
            -mountpoint "$dmg_mount" "dist/$dmg_name")
          printf '%s\n' "$attach_output"
          device=$(printf '%s\n' "$attach_output" | awk 'END {print $1}')
          test -d "$dmg_mount/OpenLogTool.app"
          test -L "$dmg_mount/Applications"
          codesign --verify --deep --strict --verbose=2 \
            "$dmg_mount/OpenLogTool.app"
          hdiutil detach "$device"
          device=""

          extracted="$RUNNER_TEMP/openlogtool-macos-package"
          mkdir -p "$extracted"
          ditto -x -k "dist/$zip_name" "$extracted"
          packaged_app="$extracted/OpenLogTool.app"
          packaged_executable="$packaged_app/Contents/MacOS/openlogtool"
          packaged_library="$packaged_app/Contents/Frameworks/libopenlogtool_core.dylib"
          test -x "$packaged_executable"
          test -s "$packaged_library"
          plutil -lint "$packaged_app/Contents/Info.plist"
          xcrun lipo "$packaged_executable" -verify_arch arm64 x86_64
          xcrun lipo "$packaged_library" -verify_arch arm64 x86_64
          xcrun otool -D "$packaged_library" | tail -n +2 |
            grep -Fx '@rpath/libopenlogtool_core.dylib'
          xcrun otool -l "$packaged_executable" | grep -A3 LC_RPATH |
            grep -F '@executable_path/../Frameworks'
          codesign --verify --deep --strict --verbose=2 "$packaged_app"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openlogtool-${{ needs.version.outputs.artifact_version }}-macos-universal
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS debug symbols
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-symbols-${{ needs.version.outputs.artifact_version }}-macos-universal
          path: build/symbols/macos/
          if-no-files-found: error
          retention-days: 90

  build-ios:
    name: Build and verify iOS
    needs: [version, quality]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Rust and iOS targets
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust -> target
          shared-key: openlogtool-ios

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate build version
        env:
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_BUILD_NUMBER: ${{ github.run_number }}
        run: dart tool/gen_version.dart

      - name: Build iOS release (no codesign)
        run: flutter build ios --release --no-codesign --no-pub

      - name: Verify iOS app bundle
        run: |
          set -euo pipefail
          app=build/ios/iphoneos/Runner.app
          executable="$app/Runner"
          test -x "$executable"
          ls -la ios/Runner/rustlibs/ 2>&1 || true
          if ! test -s ios/Runner/rustlibs/libopenlogtool_core.a; then
            echo "rustlibs missing: $(find ios -name '*.a' 2>/dev/null | tr '\n' ' ')" >&2
            exit 1
          fi
          xcrun lipo "$executable" -verify_arch arm64
          echo "=== nm symbol check ==="
          nm "$executable" | grep -c 'frb_init_frb_dart_api_dl' || true
          nm "$executable" | grep 'frb_init_frb_dart_api_dl' || echo "symbol NOT found in executable" >&2
          nm ios/Runner/rustlibs/libopenlogtool_core.a | grep 'frb_init_frb_dart_api_dl' || true
          plutil -lint "$app/Info.plist"

      - name: Package iOS artifacts
        run: |
          set -euo pipefail
          # 无签名 ipa（Payload 结构）。签名/安装方式由使用者自行处理
          # （自签证书或 sideload 工具），格式与正式 ipa 一致。
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr "dist/OpenLogTool-ios.ipa" Payload

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openlogtool-${{ needs.version.outputs.artifact_version }}-ios
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish cross-platform release
    needs:
      - version
      - build-android
      - build-linux
      - build-windows
      - build-macos
      - build-ios
      - build-web
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        env:
          VERSION_NAME: ${{ needs.version.outputs.version_name }}
        run: |
          set -euo pipefail
          expected_tag="v${VERSION_NAME}"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Release tag must be $expected_tag, got $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Download platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        # 用 gh CLI 下载：actions/download-artifact 偶发 digest-mismatch 平台
        # bug（重跑无效），CLI 走 API 无此校验。
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh run download "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            -p "openlogtool-${{ needs.version.outputs.artifact_version }}-*" \
            -D artifacts
          # merge-multiple 语义：把所有平台子目录的文件平铺到 artifacts/
          find artifacts -mindepth 2 -type f -exec mv -n {} artifacts/ \;
          find artifacts -mindepth 1 -type d -empty -delete

      - name: Verify release inventory
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64; do
            compgen -G "artifacts/*Android-$abi.apk" >/dev/null
          done
          compgen -G 'artifacts/*Android-universal.apk' >/dev/null
          test "$(find artifacts -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 4
          compgen -G 'artifacts/*.tar.gz' >/dev/null
          compgen -G 'artifacts/*.AppImage' >/dev/null
          compgen -G 'artifacts/*.deb' >/dev/null
          compgen -G 'artifacts/*.rpm' >/dev/null
          compgen -G 'artifacts/*.exe' >/dev/null
          compgen -G 'artifacts/*Windows*.zip' >/dev/null
          compgen -G 'artifacts/*.dmg' >/dev/null
          compgen -G 'artifacts/*macOS*.zip' >/dev/null
          compgen -G 'artifacts/*-ios.ipa' >/dev/null
          compgen -G 'artifacts/*WebClient*.tar.gz' >/dev/null
          find artifacts -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenLogTool ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          fail_on_unmatched_files: true
          files: artifacts/*
