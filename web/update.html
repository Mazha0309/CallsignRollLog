<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>更新网页程序 · OpenLogTool</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 38rem; margin: 10vh auto; padding: 1.5rem; line-height: 1.7; }
    button { font: inherit; padding: .65rem 1.2rem; cursor: pointer; }
    #status { min-height: 3em; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>更新网页程序</h1>
  <p>若页面仍显示旧版本，请先保存未完成的编辑，再关闭其他 OpenLogTool 标签页或桌面 Web 应用，然后点击下方按钮。</p>
  <p>这只会停用本应用旧版的离线程序缓存接管，并重新加载网页。不会删除本机数据库、记录、账号设置或其他站点的数据。请勿使用浏览器的“清除站点数据”。</p>
  <button id="update" type="button">保留本机数据并更新</button>
  <p id="status" role="status" aria-live="polite"></p>
  <p><a href="./">返回应用</a></p>
  <script src="update.js"></script>
</body>
</html>
